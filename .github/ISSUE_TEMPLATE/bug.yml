name: 🐛 Bug Report
description: Signaler un bug ou un comportement inattendu
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description du bug
      description: Décrivez simplement ce qui ne va pas
      placeholder: |
        Quand je crée un personnage du Tome 2 et que je sélectionne un second talent, l'app crash.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Comment reproduire
      description: Étapes simples pour reproduire
      placeholder: |
        1. Créer un personnage
        2. Sélectionner "Tome 2"
        3. Choisir un second talent
        4. Cliquer sur "Créer"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Contexte additionnel (optionnel)
      description: Navigateur, appareil, ou autres détails utiles
      placeholder: |
        Chrome sur Mac, iOS Safari...
    validations:
      required: false
